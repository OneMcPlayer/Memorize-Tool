<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4a90e2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Memorize" />
    <title>Memorize Tool</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f5f7fb;
      }
      #initial-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(160deg, #f5f7fb 0%, #e6ecf7 100%);
        color: #2c3e50;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
          sans-serif;
        text-align: center;
        padding: 24px;
        z-index: 1;
      }
      #initial-splash .splash-emoji {
        font-size: 48px;
        line-height: 1;
      }
      #initial-splash .splash-title {
        font-size: 18px;
        font-weight: 600;
        margin: 0;
      }
      #initial-splash .splash-sub {
        font-size: 14px;
        color: #6b7a8f;
        margin: 0;
      }
      #initial-splash .splash-spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid rgba(74, 144, 226, 0.2);
        border-top-color: #4a90e2;
        animation: splash-spin 0.9s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #1a1f2e;
        }
        #initial-splash {
          background: linear-gradient(160deg, #1a1f2e 0%, #232a3d 100%);
          color: #e6ecf7;
        }
        #initial-splash .splash-sub {
          color: #a0aec0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <noscript>
        <div
          style="
            padding: 24px;
            font-family: system-ui, sans-serif;
            text-align: center;
          "
        >
          <h1>JavaScript richiesto</h1>
          <p>Per utilizzare Memorize Tool è necessario abilitare JavaScript.</p>
        </div>
      </noscript>
      <div id="initial-splash" role="status" aria-live="polite">
        <div class="splash-emoji" aria-hidden="true">🎭</div>
        <div class="splash-spinner" aria-hidden="true"></div>
        <p class="splash-title">Memorizzazione Copione</p>
        <p class="splash-sub">Caricamento in corso…</p>
      </div>
    </div>
    <div
      id="boot-fallback"
      style="
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fff8e1;
        color: #5d4037;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
        z-index: 9999;
      "
    >
      <div style="max-width: 480px; text-align: center">
        <div style="font-size: 2.5rem; margin-bottom: 8px">⚠️</div>
        <h1 style="font-size: 1.25rem; margin: 0 0 8px">
          App non raggiungibile
        </h1>
        <p style="margin: 0 0 12px; line-height: 1.4">
          Il server di sviluppo non risponde. Controlla che frontend e backend
          siano avviati e che le porte siano raggiungibili: la pagina si
          ricaricherà da sola appena il server torna online.
        </p>
        <p
          id="boot-fallback-status"
          style="
            margin: 0 0 16px;
            font-size: 0.9rem;
            color: #8d6e63;
            min-height: 1.2em;
          "
        >
          Controllo dello stato del server…
        </p>
        <button
          id="boot-fallback-reload"
          type="button"
          style="
            background: #ffb300;
            color: #3e2723;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
          "
        >
          Ricarica ora
        </button>
      </div>
    </div>
    <script>
      (function () {
        // Initial wait before considering boot a failure. Vite's first request
        // after a lockfile change can re-optimize deps for many seconds.
        var INITIAL_TIMEOUT_MS = 25000;
        // Extra wait granted when the web server reports healthy — boot is just
        // slow, not stuck. Up to MAX_EXTENSIONS extensions are granted.
        var EXTENDED_TIMEOUT_MS = 15000;
        var MAX_EXTENSIONS = 2;
        // Polling cadence used after the fallback is visible.
        var POLL_INTERVAL_MS = 4000;
        var fallback = document.getElementById("boot-fallback");
        var reloadBtn = document.getElementById("boot-fallback-reload");
        var statusEl = document.getElementById("boot-fallback-status");
        var booted = false;
        var pollTimer = null;
        var reloading = false;
        var extensionsUsed = 0;
        var basePath = "%BASE_URL%";
        var basePathNoSlash = basePath.replace(/\/+$/, "");
        // Track whether we have observed an unhealthy probe at any point. We
        // only auto-reload after seeing unhealthy -> healthy, so a slow boot
        // is never restarted into another slow boot loop.
        var sawUnhealthy = false;
        if (reloadBtn) {
          reloadBtn.addEventListener("click", function () {
            window.location.reload();
          });
        }
        function setStatus(text) {
          if (statusEl) statusEl.textContent = text;
        }
        function apiUrl(path) {
          return basePathNoSlash + "/api" + path;
        }
        function getStoredAccessToken() {
          try {
            if (!window.localStorage) return null;
            var scopedKey = "mainAccessToken:" + (basePathNoSlash || "/");
            return (
              window.localStorage.getItem(scopedKey) ||
              (basePathNoSlash
                ? null
                : window.localStorage.getItem("mainAccessToken"))
            );
          } catch (e) {
            return null;
          }
        }
        function reportFailure(reason) {
          try {
            var body = JSON.stringify({
              reason: reason || "boot-timeout",
              userAgent: navigator.userAgent,
              url: window.location.href,
              timestamp: Date.now(),
            });
            var token = getStoredAccessToken();
            if (token) {
              fetch(apiUrl("/diag/boot-failure"), {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "X-Access-Token": token,
                },
                body: body,
                keepalive: true,
              }).catch(function () {});
            } else if (navigator.sendBeacon) {
              navigator.sendBeacon(
                apiUrl("/diag/boot-failure"),
                new Blob([body], { type: "application/json" }),
              );
            } else {
              fetch(apiUrl("/diag/boot-failure"), {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: body,
                keepalive: true,
              }).catch(function () {});
            }
          } catch (e) {}
        }
        function showFallback(reason) {
          if (booted) return;
          if (fallback) fallback.style.display = "flex";
          reportFailure(reason);
          pollHealth();
          if (!pollTimer) pollTimer = setInterval(pollHealth, POLL_INTERVAL_MS);
        }
        function pollHealth() {
          if (reloading || booted) return;
          fetch(apiUrl("/diag/web-health"), { cache: "no-store" })
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .then(function (data) {
              if (reloading || booted) return;
              if (data && data.healthy) {
                if (sawUnhealthy) {
                  reloading = true;
                  if (pollTimer) clearInterval(pollTimer);
                  setStatus("Server tornato online — ricarico…");
                  setTimeout(function () {
                    window.location.reload();
                  }, 600);
                } else {
                  setStatus(
                    "Il server risponde ma l\u2019app non si carica. " +
                      "Prova a ricaricare manualmente.",
                  );
                }
              } else {
                sawUnhealthy = true;
                setStatus("In attesa che il server torni online…");
              }
            })
            .catch(function () {
              sawUnhealthy = true;
              setStatus(
                "Anche l\u2019API non risponde. " +
                  "Controlla che il backend sia avviato.",
              );
            });
        }
        // Pre-fallback gate: if the boot timer expires but the server is
        // healthy, grant extensions instead of showing the scary screen.
        function maybeShowFallback() {
          if (booted) return;
          fetch(apiUrl("/diag/web-health"), { cache: "no-store" })
            .then(function (r) {
              return r.ok ? r.json() : { healthy: false };
            })
            .then(function (data) {
              if (booted) return;
              if (data && data.healthy && extensionsUsed < MAX_EXTENSIONS) {
                extensionsUsed++;
                // Server is fine — Vite is just optimizing deps or downloading
                // chunks. Wait some more without alarming the user.
                setTimeout(maybeShowFallback, EXTENDED_TIMEOUT_MS);
              } else {
                if (!data || !data.healthy) sawUnhealthy = true;
                showFallback(
                  data && data.healthy
                    ? "boot-stuck-healthy"
                    : "boot-stuck-unhealthy",
                );
              }
            })
            .catch(function () {
              sawUnhealthy = true;
              showFallback("boot-stuck-api-down");
            });
        }
        setTimeout(maybeShowFallback, INITIAL_TIMEOUT_MS);
        window.__memorizeBootLoaded = function () {
          booted = true;
          if (pollTimer) clearInterval(pollTimer);
          if (fallback) fallback.style.display = "none";
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
